name: Lane checks
on:
  push:
    paths: ['backend/**', 'automatic/**', 'mobile/**', 'simulator/**', 'contracts/**', 'infra/**', 'scripts/**', '**/*.md', '.github/workflows/**']
  pull_request:
    paths: ['backend/**', 'automatic/**', 'mobile/**', 'simulator/**', 'contracts/**', 'infra/**', 'scripts/**', '**/*.md', '.github/workflows/**']
concurrency:
  group: skeletons-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      service: ${{ steps.paths.outputs.service }}
      mobile: ${{ steps.paths.outputs.mobile }}
      collector: ${{ steps.paths.outputs.collector }}
      detector: ${{ steps.paths.outputs.detector }}
      contracts: ${{ steps.paths.outputs.contracts }}
      simulator: ${{ steps.paths.outputs.simulator }}
      stack: ${{ steps.paths.outputs.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            backend: ['backend/**', 'contracts/**', '.github/workflows/skeletons.yml']
            service: ['automatic/service/**', 'automatic/tests/**', 'contracts/**', '.github/workflows/skeletons.yml']
            mobile: ['mobile/**', 'contracts/**', '.github/workflows/skeletons.yml']
            collector: ['automatic/collector/**', 'contracts/**', '.github/workflows/skeletons.yml']
            detector: ['automatic/detector/**', '.github/workflows/skeletons.yml']
            simulator: ['simulator/**', 'automatic/detector/**', '.github/workflows/skeletons.yml']
            stack: ['infra/**', 'backend/**', 'automatic/service/**', 'automatic/Dockerfile', 'contracts/**', '.dockerignore', '.github/workflows/skeletons.yml']
            contracts: ['contracts/**', 'mobile/src/api/schema.d.ts', 'automatic/collector/src/api/schema.d.ts', 'automatic/service/product-api.d.ts', 'mobile/src/fixtures/**', 'automatic/collector/src/*.json', '.github/workflows/skeletons.yml']
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env: {POSTGRES_USER: product, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: product}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U product -d product" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://product:ci-only@localhost:5432/product
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: '3.13'}
      - run: uv sync --project backend --frozen
      - run: uv run --project backend pytest -c backend/pyproject.toml backend/tests -q
  service:
    needs: changes
    if: needs.changes.outputs.service == 'true'
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env: {POSTGRES_USER: observations, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: observations}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U observations -d observations" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_AUTOMATION_DATABASE_URL: postgresql://observations:ci-only@localhost:5432/observations
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: '3.13'}
      - run: uv sync --project automatic/service --frozen
      - run: uv run --project automatic/service pytest -c automatic/service/pyproject.toml automatic/tests -q
  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --prefix mobile
      - run: npm run typecheck --prefix mobile
      - run: npm test --prefix mobile
      - run: npm run build --prefix mobile
        env: {CI: '1', EXPO_NO_TELEMETRY: '1'}
  collector:
    needs: changes
    if: needs.changes.outputs.collector == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --prefix automatic/collector
      - run: npm run typecheck --prefix automatic/collector
      - run: npm test --if-present --prefix automatic/collector
      - run: npm run build --prefix automatic/collector
        env: {CI: '1', EXPO_NO_TELEMETRY: '1'}
  detector:
    needs: changes
    if: needs.changes.outputs.detector == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --prefix automatic/detector
      - run: npm test --prefix automatic/detector
  simulator:
    needs: changes
    if: needs.changes.outputs.simulator == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: present
        # Lane F's simulator arrives in its own PR; until then there is nothing here to run.
        run: test -f simulator/pyproject.toml && echo "yes=true" >> "$GITHUB_OUTPUT" || echo "simulator/ is not in this checkout yet"
      - uses: actions/setup-python@v5
        if: steps.present.outputs.yes == 'true'
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        if: steps.present.outputs.yes == 'true'
        with: {node-version: '22'}
      - if: steps.present.outputs.yes == 'true'
        run: python3 -m unittest discover -s simulator/tests -t simulator
        env: {PYTHONPATH: simulator/src}
      - if: steps.present.outputs.yes == 'true'
        run: |
          npm ci --prefix automatic/detector
          npm run build --prefix automatic/detector
          node --test "simulator/replay-detector/*.test.mjs"
  stack:
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    env:
      ENV_FILE: infra/.env.ci
      DEMO_ENVIRONMENT: 'yes'
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway CI settings (never real credentials)
        run: |
          sed -e 's/^PRODUCT_DB_PASSWORD=.*/PRODUCT_DB_PASSWORD=ci-product-only/' \
              -e 's/^AUTOMATION_PUBLISH_KEY=.*/AUTOMATION_PUBLISH_KEY=ci-publisher-only/' \
              -e 's/^OBSERVATIONS_DB_PASSWORD=.*/OBSERVATIONS_DB_PASSWORD=ci-observations-only/' infra/.env.example > infra/.env.ci
      - name: Every profile parses
        run: docker compose --env-file "$ENV_FILE" -f infra/docker-compose.yml --profile routing --profile https --profile automation config --quiet
      - name: Proxy configuration is valid, with and without the observation site
        run: |
          image="$(grep -E '^CADDY_IMAGE=' "$ENV_FILE" | cut -d= -f2-)"
          docker run --rm -e PRODUCT_HOSTNAME=localhost -e OBSERVATION_HOSTNAME=observations.localhost \
            -v "$PWD/infra/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$PWD/infra/caddy/enabled:/etc/caddy/extra:ro" "$image" caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -e PRODUCT_HOSTNAME=localhost -e OBSERVATION_HOSTNAME=observations.localhost \
            -v "$PWD/infra/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$PWD/infra/caddy:/etc/caddy/extra:ro" "$image" caddy validate --config /etc/caddy/Caddyfile
      - name: Routing engine image tag exists
        run: docker manifest inspect "$(grep -E '^VALHALLA_IMAGE=' "$ENV_FILE" | cut -d= -f2-)" > /dev/null
      - name: Manual stack starts healthy with automation absent
        run: |
          docker compose --env-file "$ENV_FILE" -f infra/docker-compose.yml up -d --build --wait
          test "$(docker compose --env-file "$ENV_FILE" -f infra/docker-compose.yml ps --services | sort | tr '\n' ' ')" = "api db "
          infra/check_stack.sh http://localhost:8000
      - name: Backup restores into a throwaway database
        run: |
          docker compose --env-file "$ENV_FILE" -f infra/docker-compose.yml exec -T db psql -U product -d product -c 'CREATE TABLE IF NOT EXISTS ci_restore_probe AS SELECT 1 AS id'
          infra/restore_check.sh "$(infra/backup.sh product /tmp/backups)"
      - name: Optional automation starts separately with its own database role
        run: |
          infra/provision_observation_db.sh
          docker compose --env-file "$ENV_FILE" -f infra/docker-compose.yml --profile automation up -d --build --wait automatic
          infra/check_stack.sh http://localhost:8000 --automation-url http://localhost:8001
      - name: End-to-end demo flow over HTTP (runs once the simulator is in the checkout)
        run: |
          if [ ! -d simulator/src/simulator ]; then echo "simulator/ not in this checkout yet; skipping"; exit 0; fi
          export PYTHONPATH=simulator/src
          infra/check_stack.sh http://localhost:8000 --write-demo
          python3 -m simulator.cli manual --scenario manual-expired --product-url http://localhost:8000 --demo-target
          AUTOMATION_PUBLISH_KEY=ci-publisher-only python3 -m simulator.cli publication --product-url http://localhost:8000 --demo-target
          if curl -fsS http://localhost:8001/healthz | grep -q '"worker":"running"'; then
            # Real worker present: synthetic observations must come back as a published, labeled hazard.
            infra/seed_demo.sh http://localhost:8000 --automation-url http://localhost:8001 --at 33.7570,-84.3895 | tee /tmp/seed.log
            python3 -m simulator.cli observations --scenario demo-seed-negative --automation-url http://localhost:8001 --product-url http://localhost:8000 --demo-target --wait 15
            echo "::notice title=End-to-end::observations -> worker -> published hazard: $(grep '"await-hazards"' /tmp/seed.log | head -c 600)"
            echo "::notice title=Health::product $(curl -fsS http://localhost:8000/healthz) | observations $(curl -fsS http://localhost:8001/healthz | head -c 300)"
          else
            echo "::notice title=End-to-end::observation service has no worker in this checkout; ingestion only, no published hazard was checked"
            python3 -m simulator.cli observations --scenario demo-seed --automation-url http://localhost:8001 --demo-target
          fi
      - name: Each side keeps running while the other is stopped
        run: |
          docker compose --env-file "$ENV_FILE" -f infra/docker-compose.yml stop api
          curl -fsS --max-time 10 http://localhost:8001/healthz
          docker compose --env-file "$ENV_FILE" -f infra/docker-compose.yml up -d --wait api
          docker compose --env-file "$ENV_FILE" -f infra/docker-compose.yml --profile automation stop automatic
          infra/check_stack.sh http://localhost:8000
      - name: Demo reset empties one dataset and the API comes back
        run: |
          infra/reset_db.sh product --yes-delete-demo-data
          docker compose --env-file "$ENV_FILE" -f infra/docker-compose.yml up -d --wait api
          infra/check_stack.sh http://localhost:8000
      - name: Shell scripts parse
        run: for f in infra/*.sh infra/db/init/*.sh infra/valhalla/*.sh infra/vultr/*.sh; do bash -n "$f"; done
      - name: Logs on failure
        if: failure()
        run: |
          docker compose --env-file "$ENV_FILE" -f infra/docker-compose.yml --profile automation ps -a || true
          docker compose --env-file "$ENV_FILE" -f infra/docker-compose.yml --profile automation logs --no-color --tail 200 || true
          # Also surface the service logs as an annotation, readable without downloading the job log.
          tail_logs="$(docker compose --env-file "$ENV_FILE" -f infra/docker-compose.yml --profile automation logs --no-color --no-log-prefix --tail 25 api automatic 2>&1 | tail -n 45)"
          tail_logs="${tail_logs//'%'/'%25'}"; tail_logs="${tail_logs//$'\r'/'%0D'}"; tail_logs="${tail_logs//$'\n'/'%0A'}"
          echo "::error title=Service logs at failure::$tail_logs"
  generated-types:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --prefix contracts
      - run: npm run generate --prefix contracts
      - run: git diff --exit-code -- mobile/src/api/schema.d.ts automatic/collector/src/api/schema.d.ts automatic/service/product-api.d.ts mobile/src/fixtures automatic/collector/src/events.json automatic/collector/src/points.json
  docs-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python3 scripts/check_docs.py
      - run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml config --quiet
      - name: Check changed-line whitespace
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --check "$BASE" HEAD
          else
            git show --format= --check HEAD
          fi
