name: Contracts
on:
  push:
    paths: ['contracts/**', '.github/workflows/contracts.yml']
  pull_request:
    paths: ['contracts/**', '.github/workflows/contracts.yml']
concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --project contracts --frozen
      - run: uv run --project contracts python contracts/scripts/validate.py
