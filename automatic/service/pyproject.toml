[project]
name = "campus-observation-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "rfc3339-validator>=0.1.4,<1",
    "psycopg[binary]==3.3.3",
    "psycopg-pool==3.3.0",
]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests"]
